apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gym-app-ingress
  namespace: gym-app
spec:
  ingressClassName: traefik
  rules:
  - host: gym.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gym-app-service
            port:
              number: 80
