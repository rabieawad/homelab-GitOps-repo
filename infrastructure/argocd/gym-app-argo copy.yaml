apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gym-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rabieawad/homelab-GitOps-repo
    targetRevision: main
    path: apps/gym-app
  destination:
    server: https://kubernetes.default.svc
    namespace: gym-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true